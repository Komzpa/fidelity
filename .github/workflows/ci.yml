name: CI

on:
  pull_request:
  push:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine

      - name: Lint
        run: |
          PYTHONWARNINGS=error ruff check .
          ruff format --check .

      - name: Test
        run: |
          PYTHONWARNINGS=error python -X dev -bb -m pytest -q
          PYTHONWARNINGS=error python -m compileall -q bin-retile.py bin_retile.py locate.py databases sensors

      - name: Smoke CLIs
        run: |
          python locate.py --offline-only --json >/tmp/fidelity-locate-source.json
          python locate.py --offline-only --json --diagnostics \
            >/tmp/fidelity-locate-diagnostics.json
          fidelity-locate --offline-only --json >/tmp/fidelity-locate-installed.json
          python -m locate --offline-only --json >/tmp/fidelity-locate-module.json
          python -m bin_retile --help >/tmp/fidelity-retile-module-help.txt
          mkdir -p /tmp/fidelity-retile-smoke
          python - <<'PY'
          import struct

          import databases

          with open("/tmp/fidelity-retile-smoke/wifi.bin", "wb") as cache_file:
              cache_file.write(
                  struct.pack(
                      "!qff",
                      databases.mac2int("aa:bb:cc:00:11:22"),
                      30.0,
                      10.0,
                  )
              )
          PY
          fidelity-retile \
            --directory /tmp/fidelity-retile-smoke \
            --index /tmp/fidelity-retile-smoke/index.json
          test -s /tmp/fidelity-retile-smoke/index.json
          python -m databases.algo.weighted_storage_cube >/tmp/fidelity-weighted-storage.txt

      - name: Build package
        run: |
          python -m build --wheel --sdist
          python -m twine check dist/*
          ! tar -tzf dist/fidelity-*.tar.gz | grep -E '(^|/)(data|__pycache__|\.pytest_cache|tmp|dist|build|\.venv)(/|$)|openwlanmap\.z|openbmap\.z'
          ! unzip -Z1 dist/fidelity-*.whl | grep -E '(^|/)(data|__pycache__|\.pytest_cache|tmp|dist|build|\.venv)(/|$)|openwlanmap\.z|openbmap\.z'
